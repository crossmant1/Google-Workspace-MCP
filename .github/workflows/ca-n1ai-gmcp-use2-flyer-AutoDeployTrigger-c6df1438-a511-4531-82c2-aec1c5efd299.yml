name: Trigger auto deployment for ca-n1ai-gmcp-use2-flyer

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-n1ai-gmcp-use2-flyer-AutoDeployTrigger-c6df1438-a511-4531-82c2-aec1c5efd299.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAN1AIGMCPUSE2FLYER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAN1AIGMCPUSE2FLYER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAN1AIGMCPUSE2FLYER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.CAN1AIGMCPUSE2FLYER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAN1AIGMCPUSE2FLYER_REGISTRY_PASSWORD }}
          containerAppName: ca-n1ai-gmcp-use2-flyer
          resourceGroup: rg-flyergpt-001
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


