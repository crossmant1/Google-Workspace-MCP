[project]
name = "google-workspace-mcp-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "config>=0.5.1",
    "google-api-python-client>=2.188.0",
    "google-auth>=2.48.0",
    "google-auth-oauthlib>=1.2.4",
    "mcp[cli]>=1.26.0",
    "mysql-connector-python>=9.5.0",
    "requests>=2.32.5",
]
[project.scripts]
# This allows you to run 'uv run mcpserver'
mcpserver = "mcpserver.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mcpserver"]
