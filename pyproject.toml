[project]
name = "google-workspace-mcp-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "config>=0.5.1",
    "mcp[cli]>=1.25.0",
    "pyodbc>=5.3.0",
    "requests>=2.32.5",
]
[project.scripts]
# This allows you to run 'uv run mcpserver'
mcpserver = "mcpserver.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mcpserver"]
